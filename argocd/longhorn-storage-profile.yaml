apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-storage-profile
  namespace: default
  labels:
    app.kubernetes.io/name: ecom-app
    app.kubernetes.io/part-of: ecom-app
data:
  STORAGE_MODE: distributed
  STORAGE_CLASS_NAME: longhorn
  STORAGE_GUIDANCE: |
    This manifest documents the distributed storage profile expected by the Helm chart.
    Install Longhorn first, then set:
      global.storage.mode=distributed
      global.storageClass.name=longhorn
      global.storageClass.create=false
