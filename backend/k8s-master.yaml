  name: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: buiducthien090605/my-inventory-service:latest
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "3003"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        - name: MONGO_URI
          value: "mongodb://1:1@ac-1ilix43-shard-00-00.7l9cb3j.mongodb.net:27017,ac-1ilix43-shard-00-01.7l9cb3j.mongodb.net:27017,ac-1ilix43-shard-00-02.7l9cb3j.mongodb.net:27017/?ssl=true&replicaSet=atlas-5tosmn-shard-0&authSource=admin&appName=inventorydb"
        - name: OTEL_SERVICE_NAME
          value: "inventory-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
