---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: buiducthien090605/my-order-service:latest
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "3002"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        - name: MONGO_URI
          value: "mongodb://1:1@ac-1ilix43-shard-00-00.7l9cb3j.mongodb.net:27017,ac-1ilix43-shard-00-01.7l9cb3j.mongodb.net:27017,ac-1ilix43-shard-00-02.7l9cb3j.mongodb.net:27017/?ssl=true&replicaSet=atlas-5tosmn-shard-0&authSource=admin&appName=orderdb"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:3001"
        - name: OTEL_SERVICE_NAME
          value: "order-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4318/v1/traces"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: buiducthien090605/my-product-service:latest
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "3001"
        - name: MONGO_URI
          value: "mongodb://1:1@ac-1ilix43-shard-00-00.7l9cb3j.mongodb.net:27017,ac-1ilix43-shard-00-01.7l9cb3j.mongodb.net:27017,ac-1ilix43-shard-00-02.7l9cb3j.mongodb.net:27017/?ssl=true&replicaSet=atlas-5tosmn-shard-0&authSource=admin&appName=productdb"
        - name: OTEL_SERVICE_NAME
          value: "product-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4318/v1/traces"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 3001
      targetPort: 3001
  type: LoadBalancer
---
apiVersion: apps/v1
