apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/buiducthien090605/project.git'
    path: backend
    targetRevision: final
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
