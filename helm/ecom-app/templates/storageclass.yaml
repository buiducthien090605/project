{{- if .Values.global.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.global.storageClass.name }}
  labels:
    {{- include "ecom-app.labels" . | nindent 4 }}
  {{- with .Values.global.storageClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
provisioner: {{ .Values.global.storageClass.provisioner }}
reclaimPolicy: {{ .Values.global.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.global.storageClass.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.global.storageClass.allowVolumeExpansion }}
{{- with .Values.global.storageClass.parameters }}
parameters:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
