replicaCount: 2
containerPort: 3002

image:
  repository: my-order-service
  tag: latest

service:
  type: ClusterIP
  port: 3002
  canaryPort: 3002

ingress:
  enabled: true
  path: /api/orders
  pathType: Prefix
  annotations: {}

rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause:
        duration: 60s
    - setWeight: 60
    - pause:
        duration: 60s

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 60
