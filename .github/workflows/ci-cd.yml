name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - '**' 
    paths:
      - 'backend/**'
      - '.github/workflows/**'
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Product Service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/Product_Service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-product-service:latest
            ${{ secrets.DOCKER_USERNAME }}/my-product-service:${{ env.IMAGE_TAG }}
      - name: Build and Push Order Service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/Order_Service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-order-service:latest
            ${{ secrets.DOCKER_USERNAME }}/my-order-service:${{ env.IMAGE_TAG }}
      - name: Build and Push Inventory Service
        uses: docker/build-push-action@v4
        with:
          context: ./backend/Inventory_Service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-inventory-service:latest
            ${{ secrets.DOCKER_USERNAME }}/my-inventory-service:${{ env.IMAGE_TAG }}
