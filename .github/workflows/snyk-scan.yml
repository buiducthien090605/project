name: Reusable Snyk Security Scan

on:
  workflow_call:
    inputs:
      service_name:
        description: "Name of the microservice"
        required: true
        type: string
      service_path:
        description: "Path to the microservice directory"
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        description: "Snyk API Token"
        required: true

jobs:
  snyk:
    name: Snyk Scan - ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd ${{ inputs.service_path }}
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Snyk Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=${{ inputs.service_path }}/package.json --severity-threshold=high
