name: Order Service CI

on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true
      SONAR_PROJECT_KEY:
        required: false
      SONAR_ORG_KEY:
        required: false

env:
  SERVICE_NAME: order-service
  SERVICE_PATH: ./backend/Order_Service
  IMAGE_NAME: my-order-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: CI Pipeline - Order Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd ${{ env.SERVICE_PATH }}
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests (if configured)
        run: |
          cd ${{ env.SERVICE_PATH }}
          if grep -q "no test specified" package.json; then
            echo "Default test placeholder found. Skipping tests."
          else
            npm test
          fi

      - name: SonarQube/SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ${{ env.SERVICE_PATH }}
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || format('buiducthien090605-project-{0}', env.SERVICE_NAME) }}
            -Dsonar.projectName=${{ env.SERVICE_NAME }}
            -Dsonar.sources=.
            ${{ secrets.SONAR_ORG_KEY && format('-Dsonar.organization={0}', secrets.SONAR_ORG_KEY) || '' }}

      - name: Run Snyk Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --file=${{ env.SERVICE_PATH }}/package.json --severity-threshold=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
